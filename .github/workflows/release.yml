name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -r requirements.txt -r requirements-windows.txt

      - name: Build portable exe
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name PDFRedactor --icon redactor/static/icon.ico --manifest scripts/app.manifest --collect-all pymupdf --collect-all webview --add-data "redactor/static;redactor/static" launch.py

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/PDFRedactor.exe

  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Mac app
        run: bash scripts/build_mac.sh

      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: dist/PDFRedactor-mac.zip

  mac-universal:
    needs: mac
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: build/mac-arch

      - name: Merge Intel and Apple silicon apps
        run: |
          ditto -x -k build/mac-arch/mac-arm64/PDFRedactor-mac.zip build/arm
          ditto -x -k build/mac-arch/mac-x86_64/PDFRedactor-mac.zip build/x86
          bash scripts/merge_mac_apps.sh build/arm/PDFRedactor.app build/x86/PDFRedactor.app dist/PDFRedactor.app
          ditto -c -k --keepParent dist/PDFRedactor.app dist/PDFRedactor-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/PDFRedactor-mac.zip

      - name: Attach the Mac app to the latest release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --json tagName --jq .tagName)
          gh release upload "$tag" dist/PDFRedactor-mac.zip --clobber
          TAG="$tag" python3 - <<'PY'
          import os, subprocess
          tag = os.environ["TAG"]
          notes = subprocess.check_output(["gh", "release", "view", tag, "--json", "body", "--jq", ".body"], text=True)
          line = "Mac (Intel and Apple silicon): download PDFRedactor-mac.zip, unzip it, and open PDFRedactor. The first time, Control-click the app and choose Open."
          if "Intel and Apple silicon" in notes:
              raise SystemExit
          old = "Mac (Apple silicon): download PDFRedactor-mac.zip, unzip it, and open PDFRedactor. The first time, Control-click the app and choose Open."
          notes = notes.replace(old, line) if old in notes else notes.rstrip() + "\n\n" + line + "\n"
          subprocess.check_call(["gh", "release", "edit", tag, "--notes", notes])
          PY

  publish:
    if: github.event_name == 'push'
    needs: [windows, mac-universal]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: PDF Redactor ${{ github.ref_name }}
          files: |
            dist/windows/PDFRedactor.exe
            dist/mac/PDFRedactor-mac.zip
          body: |
            Portable app. No installer.
            Windows: download PDFRedactor.exe and double-click it.
            Mac (Intel and Apple silicon): download PDFRedactor-mac.zip, unzip it, and open PDFRedactor. The first time, Control-click the app and choose Open.
            The original PDF is left unchanged. Save a copy writes a new file with the redacted text removed.
          fail_on_unmatched_files: true
